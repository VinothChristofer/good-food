<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodFood - Daily Nutrition Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-gradient-to-r from-violet-600 to-indigo-700 text-white py-6 shadow-xl mb-8 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4">
            <h1 class="text-3xl font-bold tracking-tight">GoodFood</h1>
            <p class="text-indigo-200 text-sm mt-1">Track your daily nutrition using a local food dictionary.</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        
        <!-- MEAL CONTAINERS CONTAINER -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8" id="meals-wrapper">
            <!-- Meal templates will be injected here via JS: Breakfast, Lunch, Dinner -->
        </div>

        <!-- OVERALL DAILY SUMMARY -->
        <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/50 p-6 max-w-3xl mx-auto">
            <div class="flex items-center space-x-3 mb-6">
                <div class="p-3 bg-indigo-900/50 text-indigo-400 rounded-xl border border-indigo-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-100">Overall Daily Summary</h2>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-slate-900/50 p-4 rounded-xl text-center border border-slate-700/50">
                    <span class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Calories</span>
                    <span id="day-cal" class="text-2xl font-black text-slate-200">0</span> <span class="text-xs text-slate-400">kcal</span>
                </div>
                <div class="bg-violet-950/30 p-4 rounded-xl text-center border border-violet-500/20">
                    <span class="block text-xs font-semibold uppercase tracking-wider text-violet-400 mb-1">Protein</span>
                    <span id="day-protein" class="text-2xl font-black text-violet-300">0</span> <span class="text-xs text-violet-400">g</span>
                </div>
                <div class="bg-amber-950/30 p-4 rounded-xl text-center border border-amber-500/20">
                    <span class="block text-xs font-semibold uppercase tracking-wider text-amber-400 mb-1">Fat</span>
                    <span id="day-fat" class="text-2xl font-black text-amber-300">0</span> <span class="text-xs text-amber-400">g</span>
                </div>
                <div class="bg-cyan-950/30 p-4 rounded-xl text-center border border-cyan-500/20">
                    <span class="block text-xs font-semibold uppercase tracking-wider text-cyan-400 mb-1">Fibre</span>
                    <span id="day-fibre" class="text-2xl font-black text-cyan-300">0</span> <span class="text-xs text-cyan-400">g</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Local Data and Application Logic -->
    <script>
        // Expanded Local Food Dictionary Setup
        const foodDictionary = [
            { id: "14", name: "Apple", quantity: 1, unit: "nos", calories: 95, protein: 0.5, carbs: 25.0, fat: 0.3, fibre: 4.4 },
            { id: "16", name: "Banana - mid size", quantity: 1, unit: "nos", calories: 105, protein: 1.3, carbs: 27.0, fat: 0.4, fibre: 3.1 },
            { id: "17", name: "Banana - small size", quantity: 1, unit: "nos", calories: 70, protein: 0.9, carbs: 18.0, fat: 0.2, fibre: 2.0 },
            { id: "33", name: "Beans Poriyal", quantity: 50, unit: "g", calories: 40, protein: 1.1, carbs: 4.5, fat: 1.8, fibre: 1.6 },
            { id: "32", name: "Beetroot Poriyal", quantity: 50, unit: "g", calories: 45, protein: 1.0, carbs: 6.5, fat: 1.8, fibre: 1.4 },
            { id: "28", name: "Black Chana Gravy", quantity: 50, unit: "g", calories: 65, protein: 3.0, carbs: 9.0, fat: 2.0, fibre: 2.2 },
            { id: "1", name: "Boiled Eggs", quantity: 1, unit: "nos", calories: 78, protein: 6.3, carbs: 0.6, fat: 5.3, fibre: 0 },
            { id: "3", name: "Boiled Rice", quantity: 150, unit: "g", calories: 200, protein: 4.0, carbs: 44.0, fat: 0.4, fibre: 0.6 },
            { id: "21", name: "Chappati", quantity: 1, unit: "nos", calories: 85, protein: 3.0, carbs: 18.0, fat: 0.5, fibre: 2.0 },
            { id: "30", name: "Coconut Chutney", quantity: 50, unit: "g", calories: 110, protein: 1.2, carbs: 3.5, fat: 10.0, fibre: 1.5 },
            { id: "12", name: "Dal", quantity: 50, unit: "g", calories: 60, protein: 3.5, carbs: 10.5, fat: 0.2, fibre: 1.8 },
            { id: "19", name: "Dosa", quantity: 1, unit: "nos", calories: 135, protein: 3.0, carbs: 22.0, fat: 4.5, fibre: 1.0 },
            { id: "18", name: "Dragon fruit", quantity: 1, unit: "nos", calories: 150, protein: 2.5, carbs: 30.0, fat: 0.5, fibre: 7.0 },
            { id: "34", name: "Dried Green Pea Curry", quantity: 50, unit: "g", calories: 60, protein: 3.2, carbs: 8.5, fat: 1.5, fibre: 2.0 },
            { id: "25", name: "Egg Bhurji", quantity: 50, unit: "g", calories: 110, protein: 5.5, carbs: 1.5, fat: 8.5, fibre: 0.3 },
            { id: "23", name: "Fried chicken", quantity: 50, unit: "g", calories: 150, protein: 12.0, carbs: 1.0, fat: 10.5, fibre: 0 },
            { id: "2", name: "Fried carrot", quantity: 50, unit: "g", calories: 65, protein: 0.5, carbs: 6.0, fat: 4.5, fibre: 1.4 },
            { id: "4", name: "Fried potato", quantity: 50, unit: "g", calories: 140, protein: 1.3, carbs: 18.0, fat: 7.0, fibre: 1.1 },
            { id: "11", name: "Full boil", quantity: 1, unit: "nos", calories: 90, protein: 6.3, carbs: 0.6, fat: 6.8, fibre: 0 },
            { id: "13", name: "Greek yogurt", quantity: 100, unit: "g", calories: 70, protein: 10.0, carbs: 3.5, fat: 0.4, fibre: 0 },
            { id: "20", name: "Idly", quantity: 1, unit: "nos", calories: 60, protein: 2.0, carbs: 12.0, fat: 0.2, fibre: 0.8 },
            { id: "22", name: "Masala chicken", quantity: 50, unit: "g", calories: 110, protein: 11.5, carbs: 2.0, fat: 6.0, fibre: 0.5 },
            { id: "5", name: "Mashed potato", quantity: 50, unit: "g", calories: 55, protein: 1.0, carbs: 8.5, fat: 2.0, fibre: 0.9 },
            { id: "24", name: "Milk", quantity: 20, unit: "ml", calories: 13, protein: 0.7, carbs: 1.0, fat: 0.7, fibre: 0 },
            { id: "10", name: "Omelette", quantity: 1, unit: "nos", calories: 95, protein: 6.3, carbs: 0.6, fat: 7.5, fibre: 0 },
            { id: "26", name: "Paneer Bhurji", quantity: 50, unit: "g", calories: 135, protein: 6.0, carbs: 2.5, fat: 10.5, fibre: 0.4 },
            { id: "8", name: "Paneer cashew gravy", quantity: 50, unit: "g", calories: 150, protein: 6.0, carbs: 4.5, fat: 12.0, fibre: 0.5 },
            { id: "9", name: "Paneer gravy", quantity: 50, unit: "g", calories: 125, protein: 4.5, carbs: 3.5, fat: 9.5, fibre: 0.3 },
            { id: "29", name: "Pesarattu", quantity: 1, unit: "nos", calories: 140, protein: 6.0, carbs: 20.0, fat: 4.0, fibre: 2.5 },
            { id: "15", name: "Pomogranete", quantity: 1, unit: "nos", calories: 120, protein: 2.5, carbs: 26.0, fat: 1.5, fibre: 5.0 },
            { id: "27", name: "Sambar", quantity: 50, unit: "g", calories: 35, protein: 1.5, carbs: 5.0, fat: 1.0, fibre: 1.2 },
            { id: "6", name: "Soya chunks - gravy", quantity: 50, unit: "g", calories: 95, protein: 8.5, carbs: 6.0, fat: 4.0, fibre: 2.5 },
            { id: "35", name: "Soya Chunks + 2 Egg Omelette", quantity: 1, unit: "nos", calories: 350, protein: 37.0, carbs: 18.0, fat: 15.0, fibre: 6.5 },
            { id: "7", name: "Stir fry paneer", quantity: 50, unit: "g", calories: 160, protein: 9.0, carbs: 2.0, fat: 13.0, fibre: 0 },
            { id: "31", name: "Tomato Chutney", quantity: 50, unit: "g", calories: 45, protein: 0.8, carbs: 5.0, fat: 2.5, fibre: 0.9 },
            { id: "36", name: "Almond", quantity: 5, unit: "nos", calories: 35, protein: 1.3, carbs: 1.3, fat: 3.0, fibre: 0.7 },
            { id: "37", name: "Boiled White Chana", quantity: 50, unit: "g", calories: 82, protein: 4.4, carbs: 13.7, fat: 1.3, fibre: 3.8 },
            { id: "38", name: "Brinjal Gravy", quantity: 50, unit: "g", calories: 40, protein: 0.8, carbs: 4.5, fat: 2.2, fibre: 1.5 },
            { id: "39", name: "Cashew", quantity: 5, unit: "nos", calories: 42, protein: 1.3, carbs: 2.3, fat: 3.3, fibre: 0.3 },
            { id: "40", name: "Honey", quantity: 1, unit: "tbsp", calories: 64, protein: 0.1, carbs: 17.3, fat: 0.0, fibre: 0.0 },
            { id: "41", name: "White Chana Gravy", quantity: 50, unit: "g", calories: 70, protein: 3.2, carbs: 9.5, fat: 2.1, fibre: 2.4 }
        ];

        // Sort items alphabetically so the dropdown menu looks clean
        foodDictionary.sort((a, b) => a.name.localeCompare(b.name));

        const MEALS = ['Breakfast', 'Lunch', 'Dinner'];
        const ROWS_PER_MEAL = 6;
        let appData = {};

        // Generate UI Elements dynamically
        const wrapper = document.getElementById('meals-wrapper');
        MEALS.forEach(meal => {
            let mealKey = meal.toLowerCase();
            appData[mealKey] = Array(ROWS_PER_MEAL).fill().map(() => ({ foodId: '', quantity: 0, cal: 0, pro: 0, fat: 0, fib: 0 }));

            let html = `
                <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700/50 p-5 flex flex-col justify-between select-none" id="panel-${mealKey}">
                    <div>
                        <h2 class="text-xl font-bold text-slate-100 mb-4 pb-2 border-b border-slate-700/50 flex items-center justify-between">
                            <span>${meal}</span>
                            <span class="text-xs bg-slate-900 text-slate-400 px-2 py-1 rounded-full font-normal">6 Items</span>
                        </h2>
                        
                        <div class="space-y-3 mb-5">
            `;

            for (let i = 0; i < ROWS_PER_MEAL; i++) {
                html += `
                    <div class="flex items-center space-x-2 row-item" data-meal="${mealKey}" data-index="${i}">
                        <!-- Food Item Dropdown Selection -->
                        <select class="select-food flex-1 min-w-0 bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-violet-500 transition">
                            <option value="">Choose Food...</option>
                            ${foodDictionary.map(item => `<option value="${item.id}">${item.name}</option>`).join('')}
                        </select>
                        
                        <!-- Quantitative Input Element -->
                        <input type="number" placeholder="Qty" min="0" disabled step="any"
                            class="input-qty w-16 bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-2 py-2 text-sm text-center focus:outline-none focus:border-violet-500 transition disabled:opacity-40">
                        
                        <!-- Dynamic Measurement Unit Wrapper -->
                        <span class="unit-label text-xs font-semibold text-slate-500 w-8 text-left"></span>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>

                    <!-- Individual Meal Summary -->
                    <div class="mt-6 pt-4 border-t border-slate-700/50 bg-slate-900/40 -mx-5 -mb-5 p-5 rounded-b-2xl grid grid-cols-4 gap-1 text-center text-xs">
                        <div><span class="block text-slate-400 font-medium">Cals</span><strong class="text-sm font-bold text-slate-200 meal-cal">0</strong></div>
                        <div><span class="block text-violet-400 font-medium">Prot</span><strong class="text-sm font-bold text-violet-300 meal-pro">0</strong></div>
                        <div><span class="block text-amber-400 font-medium">Fat</span><strong class="text-sm font-bold text-amber-300 meal-fat">0</strong></div>
                        <div><span class="block text-cyan-400 font-medium">Fibr</span><strong class="text-sm font-bold text-cyan-300 meal-fib">0</strong></div>
                    </div>
                </div>
            `;
            wrapper.insertAdjacentHTML('beforeend', html);
        });

        // Event Setup for tracking row modifications
        document.querySelectorAll('.row-item').forEach(row => {
            const meal = row.dataset.meal;
            const index = parseInt(row.dataset.index);
            const selectFood = row.querySelector('.select-food');
            const inputQty = row.querySelector('.input-qty');
            const unitLabel = row.querySelector('.unit-label');

            const updateRowMetrics = () => {
                const selectedId = selectFood.value;
                const currentQty = parseFloat(inputQty.value) || 0;
                const matchedFood = foodDictionary.find(f => f.id === selectedId);

                if (matchedFood && currentQty > 0) {
                    const ratio = currentQty / matchedFood.quantity;
                    appData[meal][index] = {
                        foodId: selectedId,
                        quantity: currentQty,
                        cal: matchedFood.calories * ratio,
                        pro: matchedFood.protein * ratio,
                        fat: matchedFood.fat * ratio,
                        fib: matchedFood.fibre * ratio
                    };
                } else {
                    appData[meal][index] = { foodId: '', quantity: 0, cal: 0, pro: 0, fat: 0, fib: 0 };
                }
                calculateTotals();
            };

            selectFood.addEventListener('change', () => {
                const matchedFood = foodDictionary.find(f => f.id === selectFood.value);
                if (matchedFood) {
                    inputQty.disabled = false;
                    inputQty.value = matchedFood.quantity;
                    unitLabel.textContent = matchedFood.unit;
                } else {
                    inputQty.disabled = true;
                    inputQty.value = '';
                    unitLabel.textContent = '';
                }
                updateRowMetrics();
            });

            inputQty.addEventListener('input', updateRowMetrics);
        });

        function calculateTotals() {
            let dayCal = 0, dayPro = 0, dayFat = 0, dayFib = 0;

            MEALS.forEach(meal => {
                let mealKey = meal.toLowerCase();
                let mCal = 0, mPro = 0, mFat = 0, mFib = 0;

                appData[mealKey].forEach(row => {
                    mCal += row.cal;
                    mPro += row.pro;
                    mFat += row.fat;
                    mFib += row.fib;
                });

                const panel = document.getElementById(`panel-${mealKey}`);
                if (panel) {
                    panel.querySelector('.meal-cal').textContent = Math.round(mCal);
                    panel.querySelector('.meal-pro').textContent = mPro.toFixed(1);
                    panel.querySelector('.meal-fat').textContent = mFat.toFixed(1);
                    panel.querySelector('.meal-fib').textContent = mFib.toFixed(1);
                }

                dayCal += mCal;
                dayPro += mPro;
                dayFat += mFat;
                dayFib += mFib;
            });

            document.getElementById('day-cal').textContent = Math.round(dayCal);
            document.getElementById('day-protein').textContent = dayPro.toFixed(1);
            document.getElementById('day-fat').textContent = dayFat.toFixed(1);
            document.getElementById('day-fibre').textContent = dayFib.toFixed(1);
        }

        // Run baseline setup render
        calculateTotals();
    </script>
</body>
</html>
